[project]
name = "rag-docs-api"
version = "0.1.0"
description = "RAG API over documents built with FastAPI, PostgreSQL + pgvector and Ollama."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
